<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<script src="validate.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#F4F0EA;color:#1F1B16;font-family:'Hanken Grotesk',sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:#8B6A4A;text-decoration:none}
a:hover{color:#1F1B16}
button,input,select{font:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:#F8F5F0;border-right:1px solid #E6DFD3;padding:28px 16px;display:flex;flex-direction:column;gap:32px}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.mark{width:38px;height:38px;border-radius:10px;background:#1F1B16;color:#F8F5F0;display:flex;align-items:center;justify-content:center;font-family:'Bodoni Moda',serif;font-size:20px;font-weight:600;flex-shrink:0}
.brand-n{font-weight:600;font-size:15px}
.brand-s{font-size:12px;color:#7A7166;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{padding:10px 12px;border-radius:10px;font-size:14px;color:#6F665B}
.nav a:hover{background:#F0EBE3;color:#1F1B16}
.nav a.on{background:#ECE5DA;color:#1F1B16;font-weight:600}
.src{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 8px}
.src-t{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#7A7166;font-weight:600}
.src-r{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.src-r span:last-child{color:#7A7166}
.src-f{font-size:12px;line-height:1.5;color:#7A7166;border-top:1px solid #E6DFD3;padding-top:12px}
.main{padding:32px 36px 56px;display:flex;flex-direction:column;gap:18px;min-width:0;width:100%;max-width:1480px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.head h1{font-family:'Bodoni Moda',serif;font-size:40px;font-weight:500;line-height:1;margin:0}
.head-s{font-size:14px;color:#6F665B;margin-top:8px}
.head-r{display:flex;gap:14px;align-items:center}
.updated{font-size:13px;color:#7A7166}
.btn{all:unset;padding:10px 18px;border-radius:10px;background:#1F1B16;color:#FFFDFA;font-size:13px;font-weight:600;cursor:pointer;text-align:center}
.btn:hover{background:#3A332B}
.btn.ghost{background:transparent;color:#1F1B16;border:1px solid #E3DBCF;padding:9px 17px}
.btn.ghost:hover{background:#F4EFE7}
/* filter bar */
.filters{display:flex;flex-direction:column;gap:10px;padding:10px 12px;background:#FFFDFA;border:1px solid #E9E2D7;border-radius:14px}
.frow{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
.fdiv{width:1px;height:24px;background:#E6DFD3}
@media (max-width:1400px){.fdiv{display:none}}
.fsp{flex:1}
.seg{display:flex;gap:2px;padding:3px;background:#EFE9E0;border-radius:10px}
.seg button{all:unset;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#6F665B;cursor:pointer;white-space:nowrap}
.seg button:hover{color:#1F1B16}
.seg button.on{background:#FFFFFF;color:#1F1B16;box-shadow:0 1px 2px rgba(31,27,22,.14)}
.dates{display:flex;align-items:center;gap:6px;font-size:13px;color:#6F665B}
.dates input,.txt{border:1px solid #E3DBCF;border-radius:10px;padding:6px 10px;font-size:13px;color:#1F1B16;background:#FFFFFF;outline:none}
.dates input:focus,.txt:focus{border-color:#8B6A4A}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid #ECE5DA;color:#7A7166;white-space:nowrap}
.chip:hover{color:#1F1B16}
.chip.on{background:#F1EBE1;border-color:#D9CDBB;color:#1F1B16}
.chip i{width:9px;height:9px;border-radius:50%;border:1.5px solid;box-sizing:border-box}
.sel{position:relative;display:flex;align-items:center}
.sel select{appearance:none;font-size:13px;font-weight:500;color:#1F1B16;background:#FFFFFF;border:1px solid #E3DBCF;border-radius:10px;padding:7px 30px 7px 12px;cursor:pointer;max-width:240px}
.sel::after{content:'▼';position:absolute;right:12px;font-size:9px;color:#6F665B;pointer-events:none}
.sw{all:unset;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500;color:#1F1B16;cursor:pointer;white-space:nowrap}
.sw-t{width:32px;height:18px;border-radius:9px;background:#DDD3C4;position:relative;transition:background .15s;flex-shrink:0}
.sw-t::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(31,27,22,.25);transition:transform .15s}
.sw.on .sw-t{background:#1F1B16}
.sw.on .sw-t::after{transform:translateX(14px)}
.adv{all:unset;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:10px;border:1px solid #E3DBCF;font-size:13px;font-weight:600;cursor:pointer;color:#1F1B16;background:#FFFFFF}
.adv:hover{border-color:#CDBFAC}
.adv svg{width:14px;height:14px}
.adv b{min-width:18px;height:18px;border-radius:9px;background:#1F1B16;color:#FFFDFA;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.reset{all:unset;font-size:13px;color:#8B6A4A;font-weight:600;cursor:pointer;padding:6px 4px}
.reset:hover{color:#1F1B16}
.active{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px;border-top:1px solid #F0EAE1}
.ac{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 11px;border-radius:999px;background:#F1EBE1;font-size:12.5px;color:#1F1B16;white-space:nowrap}
.ac span{color:#7A7166}
.ac em{font-style:normal;font-size:11px;color:#8B6A4A;font-weight:600;margin-left:2px}
.ac button{all:unset;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#6F665B;font-size:14px;line-height:1}
.ac button:hover{background:#E3D9CA;color:#1F1B16}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(31,27,22,.18);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100vw;background:#FFFDFA;border-left:1px solid #E6DFD3;box-shadow:-12px 0 40px rgba(31,27,22,.12);z-index:31;display:flex;flex-direction:column}
.dr-h{display:flex;justify-content:space-between;align-items:center;padding:22px 24px 18px;border-bottom:1px solid #EFE9E0}
.dr-h div{font-family:'Bodoni Moda',serif;font-size:24px;font-weight:500}
.dr-x{all:unset;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;color:#6F665B}
.dr-x:hover{background:#F4EFE7;color:#1F1B16}
.dr-b{flex:1;overflow-y:auto;padding:8px 24px 24px;display:flex;flex-direction:column}
.dr-sec{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#7A7166;font-weight:600;padding:20px 0 4px}
.dr-f{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-bottom:1px solid #F2EDE5}
.dr-f:last-child{border-bottom:0}
.dr-f .sel select{width:100%;max-width:none}
.dr-l{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:600}
.dr-l button{all:unset;font-size:12px;color:#8B6A4A;font-weight:600;cursor:pointer}
.dr-l button:hover{color:#1F1B16}
.dr-ft{display:flex;gap:10px;padding:16px 24px;border-top:1px solid #EFE9E0}
.dr-ft .btn{flex:1}
.sm-list{max-height:200px;overflow-y:auto;border:1px solid #EFE9E0;border-radius:10px;padding:4px}
.sm-o{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;font-size:13.5px;cursor:pointer}
.sm-o:hover{background:#F6F1EA}
.sm-o input{accent-color:#1F1B16;margin:0}
.sm-n{font-size:12px;color:#7A7166}
.rg{position:relative;height:22px}
.rg input{position:absolute;inset:0;width:100%;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.rg input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:18px;height:18px;border-radius:50%;background:#FFFFFF;border:2px solid #1F1B16;cursor:pointer}
.rg input::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:#FFFFFF;border:2px solid #1F1B16;cursor:pointer}
.rg-t{position:absolute;left:9px;right:9px;top:9px;height:4px;border-radius:2px;background:#EFE9E0}
.rg-f{position:absolute;top:0;bottom:0;background:#8B6A4A;border-radius:2px}
.rg-v{display:flex;justify-content:space-between;font-size:13px;color:#5E564C}
/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.grid>*{grid-column:1 / -1 !important}}
@media (max-width:760px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.main{padding:24px 18px 48px}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.kpi{background:#FFFDFA;border:1px solid #E9E2D7;border-radius:16px;padding:20px 20px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi-l{font-size:13px;color:#6F665B;font-weight:500}
.kpi-v{font-size:30px;font-weight:600;letter-spacing:-.02em}
.kpi-d{display:flex;gap:6px;font-size:13px;flex-wrap:wrap}
.kpi-d b{font-weight:600}
.kpi-d span{color:#7A7166}
.kpi svg{width:100%;height:44px;margin-top:8px;overflow:visible;display:block}
.card{background:#FFFDFA;border:1px solid #E9E2D7;border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.card-h{display:flex;justify-content:space-between;gap:12px 16px;align-items:flex-start;flex-wrap:wrap}
.card-t{font-size:16px;font-weight:600}
.card-d{font-size:13px;color:#7A7166;margin-top:5px;line-height:1.45}
.card-d:empty{display:none}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.split{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#7A7166;font-weight:500}
.split .sel select{padding:5px 28px 5px 10px;font-size:12.5px;font-weight:600}
.body{position:relative;min-width:0}
.body.bleed{margin:0 -24px -12px}
.empty{font-size:14px;color:#7A7166;padding:24px 0}
.bleed .empty{padding:24px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:#6F665B;margin-bottom:12px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.legend .ln{display:inline-block;width:18px;border-top:2px solid #1F1B16;margin-right:8px;vertical-align:middle}
.legend .ln.dash{border-top-style:dashed;border-color:#B9AD9C}
.legend .lk{cursor:pointer}
.legend .lk:hover{color:#1F1B16}
.legend .lx{margin-left:auto;color:#7A7166}
.lt{display:flex;align-items:baseline;gap:10px;margin:-6px 0 12px;flex-wrap:wrap}
.lt-v{font-size:26px;font-weight:600;letter-spacing:-.01em}
.lt-d{font-size:13px;font-weight:600}
.lt-s{font-size:13px;color:#7A7166}
svg text{font-family:'Hanken Grotesk',sans-serif}
.ax{font-size:12px;fill:#7A7166}
.ax.lk{cursor:pointer}
.ax.lk:hover{fill:#1F1B16}
.donut{position:relative;width:196px;height:196px;margin:0 auto 22px}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:none}
.donut-c span{font-size:12px;color:#7A7166}
.donut-c b{font-size:24px;font-weight:600}
.dl{display:flex;flex-direction:column;gap:4px}
.dl-r{display:grid;grid-template-columns:10px minmax(0,1fr) auto 72px;gap:10px;align-items:center;font-size:14px;padding:4px 6px;margin:0 -6px;border-radius:7px;cursor:pointer}
.dl-r:hover{background:#F6F1EA}
.dl-r i{width:10px;height:10px;border-radius:50%}
.dl-r .p{color:#7A7166}
.dl-r .v{text-align:right;font-weight:600}
.tbl-r{display:grid;gap:12px;padding:11px 24px;border-bottom:1px solid #F2EDE5;font-size:14px;align-items:center}
.tbl-r.ck{cursor:pointer}
.tbl-r:hover{background:#FAF6F0}
.tbl-h{padding:10px 24px;border-top:1px solid #EFE9E0;border-bottom:1px solid #EFE9E0;font-size:12px;font-weight:600;background:#FAF7F2;color:#7A7166}
.tbl-h:hover{background:#FAF7F2}
.tbl-h div{cursor:pointer;user-select:none}
.tbl-h div:hover,.tbl-h div.on{color:#1F1B16}
.tbl-n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl-s{font-size:12px;color:#7A7166;margin-top:2px}
.tbl-dot{display:flex;align-items:center;gap:8px}
.tbl-dot i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.r{text-align:right;justify-content:flex-end}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.rk{display:flex;flex-direction:column;gap:8px}
.rk>div{padding:5px 6px;margin:0 -6px;border-radius:8px;cursor:pointer}
.rk>div:hover{background:#F6F1EA}
.rk-t{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;gap:10px}
.rk-t div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-t div:last-child{display:flex;gap:10px;align-items:baseline}
.rk-t small{font-size:12px;font-weight:600}
.rk-t b{font-weight:600}
.rk-b{height:6px;border-radius:3px;background:#F1EBE1;overflow:hidden;margin-top:8px}
.rk-b i{display:block;height:100%;background:#8B6A4A;border-radius:3px}
.fn{display:flex;flex-direction:column;gap:6px}
.fn-rate{font-size:12px;color:#8B6A4A;font-weight:600;padding:2px 2px 0}
.fn-step{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-radius:10px;background:#F6F1EA}
.fn-step span{font-size:14px;color:#5E564C}
.fn-step b{font-size:20px;font-weight:600}
.map{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:32px;height:100%}
@media (max-width:1000px){.map{grid-template-columns:1fr;height:auto}.map-l{height:380px}.body:has(.map){height:auto !important}.map-r{border-left:0;padding-left:0}}
.map-l{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.map-svg{flex:1;min-height:0;position:relative}
.mlg{display:flex;align-items:flex-start;gap:16px;font-size:12px;color:#7A7166;flex-wrap:wrap}
.mlg-s{display:flex;align-items:flex-start}
.mlg-i{display:flex;flex-direction:column;gap:5px;width:58px}
.mlg-b{height:10px}
.mlg-i:first-child .mlg-b{border-radius:4px 0 0 4px}
.mlg-i:last-of-type .mlg-b{border-radius:0 4px 4px 0}
.mlg-max{padding-top:15px;margin-left:-4px}
.map-r{display:flex;flex-direction:column;gap:6px;border-left:1px solid #EFE9E0;padding-left:28px;min-width:0}
.side-k{font-size:13px;color:#7A7166}
.side-v{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.side-s{font-size:13px;color:#7A7166;margin-bottom:10px}
.lr{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;gap:5px 10px;align-items:baseline;padding:6px 8px;margin:0 -8px;border-radius:8px;cursor:pointer}
.lr:hover,.lr.on{background:#F6F1EA}
.lr-n{font-size:12px;color:#7A7166}
.lr-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr-p{font-size:12px;color:#7A7166}
.lr-v{font-size:14px;font-weight:600;text-align:right}
.lr-bar{grid-column:2 / 5;height:4px;background:#F1EBE1;border-radius:2px;overflow:hidden}
.lr-bar i{display:block;height:100%;border-radius:2px}
.bullets{display:flex;flex-direction:column;justify-content:space-between;height:100%;gap:10px}
.bl-top{display:flex;justify-content:space-between;align-items:baseline}
.bl-l{font-size:14px;color:#5E564C}
.bl-v{font-size:20px;font-weight:600}
.bl-track{position:relative;height:22px;margin:8px 0 7px;background:#F4EFE7;border-radius:5px}
.bl-band{position:absolute;left:0;top:0;bottom:0;background:#E9E0D2;border-radius:5px 0 0 5px}
.bl-fill{position:absolute;left:0;top:7px;height:8px;background:#1F1B16;border-radius:4px}
.bl-tgt{position:absolute;top:-3px;width:3px;height:28px;background:#8B6A4A;margin-left:-1.5px;border-radius:2px}
.bl-sub{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:#7A7166}
.coh{display:flex;flex-direction:column;height:100%;gap:3px}
.coh-r{display:grid;gap:3px;flex:1;font-size:13px}
.coh-r>div{display:flex;align-items:center}
.coh-h{flex:0 0 26px;font-size:12px;color:#7A7166;font-weight:600}
.coh .num{justify-content:flex-end;padding-right:12px}
.coh-c{justify-content:center;border-radius:5px;font-weight:600;font-size:12.5px;cursor:default}
.coh-c.empty-c{background:#F8F5F0}
.coh-h .coh-m{justify-content:center}
.err{font-size:13px;color:#B0513B;padding:12px 0;line-height:1.5}
/* invalid config */
.inv{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:64px 24px}
.inv-c{width:100%;max-width:820px;background:#FFFDFA;border:1px solid #E9E2D7;border-radius:16px;padding:32px 36px;display:flex;flex-direction:column;gap:14px}
.inv-t{font-family:'Bodoni Moda',serif;font-size:32px;font-weight:500}
.inv-s{font-size:14px;color:#5E564C;line-height:1.55}
.inv code,.inv-c code{font-family:'IBM Plex Mono',monospace;font-size:12.5px;background:#F1EBE1;color:#7A5C3E;padding:2px 6px;border-radius:5px}
.inv ol{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;border-top:1px solid #EFE9E0}
.inv li{display:flex;flex-direction:column;gap:5px;padding:12px 0;border-bottom:1px solid #F2EDE5;font-size:14px}
.inv li code{align-self:flex-start;word-break:break-all}
#tip{position:fixed;left:0;top:0;pointer-events:none;background:#1F1B16;color:#FFFDFA;border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .08s;z-index:40;white-space:nowrap}
#tip .t{color:#CFC5B6;font-size:12px}
#tip .h{color:#C4A47E;font-size:11.5px;margin-top:3px}
#tip b{font-size:15px;font-weight:600}
#tip .tr{display:flex;align-items:center;gap:8px}
#tip .tr i{width:8px;height:8px;border-radius:2px}
#tip .tr span{margin-left:auto;padding-left:18px;font-weight:600}
#tip .tt{border-top:1px solid #3A332B;margin-top:5px;padding-top:5px}
@media print{.side,.filters,.head-r,.split{display:none}.app{display:block}.card,.kpi{break-inside:avoid}}
</style>
</head>
<body>
<div class="app" id="root">
  <aside class="side">

    const w = el('div', '', ''), opts = f.def.options;
    w.style.cssText = 'display:flex;flex-direction:column;gap:8px';
    const q = el('input', 'txt'); q.placeholder = tpl(L('searchValues'), {label: f.label.toLowerCase()});
    const list = el('div', 'sm-list'), n = el('div', 'sm-n');
    const paint = () => {
      const v = S.f[f.field] || [], s = q.value.trim().toLowerCase();
      list.innerHTML = opts.filter(o => !s || String(valLabel(f.field, o)).toLowerCase().includes(s)).map(o => `<label class="sm-o"><input type="checkbox" data-i="${opts.indexOf(o)}"${v.includes(o) ? ' checked' : ''}><span>${esc(valLabel(f.field, o))}</span></label>`).join('');
      n.textContent = v.length ? tpl(L('selectedCount'), {n: v.length}) : '';
      list.querySelectorAll('input').forEach(c => c.onchange = () => { const o = opts[+c.dataset.i], cur = S.f[f.field] || []; const nx = c.checked ? opts.filter(x => x === o || cur.includes(x)) : cur.filter(x => x !== o); S.f[f.field] = nx.length ? nx : undefined; n.textContent = nx.length ? tpl(L('selectedCount'), {n: nx.length}) : ''; changed(); });
    };
    q.oninput = paint; paint(); w.append(q, list, n); return w;
  },
  range(f, changed) {
    const g = f.def, fmt = fieldFmt(f.field), span = g.max - g.min || 1, step = span / 200;
    const w = el('div', '', ''); w.style.cssText = 'display:flex;flex-direction:column;gap:10px';
    const rg = el('div', 'rg', `<div class="rg-t"><div class="rg-f"></div></div><input type="range"><input type="range">`), vals = el('div', 'rg-v', '<span></span><span></span>');
    const [a, b] = rg.querySelectorAll('input'), fill = rg.querySelector('.rg-f');
    [a, b].forEach(i => { i.min = g.min; i.max = g.max; i.step = step; });
    const v = S.f[f.field] || [g.min, g.max]; a.value = v[0]; b.value = v[1];
    const send = debounce(changed);
    const upd = fire => { let lo = +a.value, hi = +b.value; if (lo > hi) [lo, hi] = [hi, lo]; fill.style.left = (lo - g.min) / span * 100 + '%'; fill.style.right = (1 - (hi - g.min) / span) * 100 + '%'; vals.children[0].textContent = fmt(lo); vals.children[1].textContent = fmt(hi); if (fire) { S.f[f.field] = lo <= g.min && hi >= g.max ? undefined : [lo, hi]; send(); } };
    a.oninput = b.oninput = () => upd(true); upd(false);
    w.append(rg, vals); return w;
  },
  toggle(f, changed) { return switchCtl(f.label, S.f[f.field] === true, on => { S.f[f.field] = on || undefined; changed(); }); },
  search(f, changed) {
    const i = el('input', 'txt'); i.type = 'search'; i.placeholder = f.label; i.value = S.f[f.field] || '';
    const send = debounce(changed);
    i.oninput = () => { S.f[f.field] = i.value || undefined; send(); };
    return i;
  },
  'date-range'(f, changed) {
    const w = el('div', 'dates'), v = S.f[f.field] || [null, null], g = f.def;
    w.innerHTML = `<input type="date" min="${isoOf(g.min)}" max="${isoOf(g.max)}" value="${v[0] || ''}"><span>–</span><input type="date" min="${isoOf(g.min)}" max="${isoOf(g.max)}" value="${v[1] || ''}">`;
    const [a, b] = w.querySelectorAll('input');
    a.onchange = b.onchange = () => { S.f[f.field] = a.value || b.value ? [a.value || null, b.value || null] : undefined; changed(); };
    return w;
  }
};
function summary(f, v) {
  const fmt = fieldFmt(f.field), lab = x => valLabel(f.field, x);
  switch (f.control) {
    case 'chips': case 'search-multi': return v.slice(0, 2).map(lab).join(', ') + (v.length > 2 ? ` +${v.length - 2}` : '');
    case 'dropdown': return lab(v);
    case 'range': return `${fmt(v[0])} – ${fmt(v[1])}`;
    case 'search': return `“${v}”`;
    case 'date-range': return `${v[0] ? F.day.format(dateOf(dayOf(v[0]))) : '…'} – ${v[1] ? F.day.format(dateOf(dayOf(v[1]))) : '…'}`;
  }
  return '';
}
function activeChips() {
  const out = [];
  AF.filter(f => f.placement === 'advanced' && isActive(f, S.f[f.field])).forEach(f => out.push({label: f.label, value: f.control === 'toggle' ? '' : summary(f, S.f[f.field]), clear: () => { S.f[f.field] = undefined; }}));
  Object.entries(adhoc()).forEach(([k, vals]) => out.push({label: fLabel(k), value: vals.map(x => valLabel(k, x)).join(', '), chart: true, clear: () => { delete adhoc()[k]; }}));
  return out;
}

/* ---------- page shell ---------- */
function bindText() { document.querySelectorAll('[data-bind]').forEach(n => { n.textContent = n.dataset.bind.split('.').reduce((o, k) => o?.[k], D) ?? ''; }); }
function ctxBase() { const [a, b] = bounds('current'); return {n: days(), range: TIME ? F.span.formatRange(dateOf(a), dateOf(b)) : ''}; }
function renderShell() {
  document.title = D.meta?.documentTitle || D.brand?.name || '';
  bindText();
  $('nav').innerHTML = D.tabs.map(t => `<a href="#${esc(t.id)}" data-tab="${esc(t.id)}">${esc(t.label)}</a>`).join('');
  const sb = D.sidebar || {};
  $('sources').innerHTML = (sb.sources?.length ? `<div class="src-t">${esc(sb.sourcesTitle)}</div>${sb.sources.map(s => `<div class="src-r"><span>${esc(s.name)}</span><span>${esc(s.detail)}</span></div>`).join('')}` : '') + (sb.footer ? `<div class="src-f">${esc(sb.footer)}</div>` : '');
}
function renderHeader() {
  const t = curTab(), ctx = ctxBase();
  $('tabTitle').textContent = tpl(t.title ?? t.label, ctx); $('tabSub').textContent = tpl(t.subtitle, ctx);
  $('nav').querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.tab === t.id));
}
function refresh(keepDrawer) { renderFilters(); renderHeader(); drawAll(); if (!keepDrawer && $('drawer')) openDrawer(); }
const FUNNEL_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h12M4.5 8h7M7 12h2"/></svg>';
function renderFilters() {
  const box = $('filters'), t = curTab(); box.innerHTML = '';
  if (t.hideFilters) { box.style.display = 'none'; return; }
  box.style.display = '';
  const row = el('div', 'frow'), add = (n, sep) => { if (sep && row.children.length) row.appendChild(el('div', 'fdiv')); row.appendChild(n); };
  if (TIME) {
    const presets = TIME.presets || [{label: '7D', days: 7}, {label: '30D', days: 30}, {label: '90D', days: 90}];
    const cur = S.time.custom ? 'custom' : S.time.days;
    add(segmented(presets.map(p => [p.days, p.label]).concat(TIME.custom ? [['custom', L('custom')]] : []), cur, v => {
      if (v === 'custom') { const [a, b] = bounds('current'); S.time = {custom: [a, b]}; } else S.time = {days: v};
      refresh();
    }));
    if (S.time.custom) {
      const w = el('div', 'dates'), [a, b] = S.time.custom, lo = isoOf(MINDAY), hi = isoOf(ASOF);
      w.innerHTML = `<span>${esc(L('from'))}</span><input type="date" min="${lo}" max="${hi}" value="${isoOf(a)}"><span>${esc(L('to'))}</span><input type="date" min="${lo}" max="${hi}" value="${isoOf(b)}">`;
      const [i1, i2] = w.querySelectorAll('input');
      i1.onchange = i2.onchange = () => { if (!i1.value || !i2.value) return; let x = dayOf(i1.value), y = dayOf(i2.value); if (x > y) [x, y] = [y, x]; S.time = {custom: [x, y]}; refresh(); };
      row.appendChild(w);
    }
    if (TIME.compare !== 'hidden') add(switchCtl(L('compare'), S.compare, on => { S.compare = on; renderHeader(); drawAll(); }), true);
  }
  AF.filter(f => f.placement === 'primary').forEach(f => add(CONTROLS[f.control](f, () => refresh(true)), true));
  row.appendChild(el('div', 'fsp'));
  const adv = AF.filter(f => f.placement === 'advanced');
  const chips = activeChips();
  if (adv.length) {
    const b = el('button', 'adv', `${FUNNEL_ICON}<span>${esc(L('advanced'))}</span>${chips.length ? `<b>${chips.length}</b>` : ''}`);
    b.onclick = openDrawer; row.appendChild(b);
  }
  const r = el('button', 'reset'); r.textContent = L('reset'); r.onclick = resetAll; row.appendChild(r);
  box.appendChild(row);
  if (chips.length) {
    const ac = el('div', 'active');
    chips.forEach(c => {
      const n = el('div', 'ac', `${esc(c.label)}${c.value ? `<span>: ${esc(c.value)}</span>` : ''}${c.chart ? `<em>${esc(L('fromChart'))}</em>` : ''}<button title="${esc(L('removeFilter'))}">×</button>`);
      n.querySelector('button').onclick = () => { c.clear(); refresh(); };
      ac.appendChild(n);
    });
    box.appendChild(ac);
  }
}
function closeDrawer() { $('drawer')?.remove(); $('scrim')?.remove(); }
function openDrawer() {
  closeDrawer();
  const t = curTab(), adv = AF.filter(f => f.placement === 'advanced');
  const scrim = el('div', 'scrim'); scrim.id = 'scrim'; scrim.onclick = closeDrawer;
  const dr = el('aside', 'drawer'); dr.id = 'drawer';
  dr.innerHTML = `<div class="dr-h"><div>${esc(L('advanced'))}</div><button class="dr-x" aria-label="Close">×</button></div><div class="dr-b"></div><div class="dr-ft"><button class="btn ghost" data-a="clear">${esc(L('clearAll'))}</button><button class="btn" data-a="done">${esc(L('done'))}</button></div>`;
  const body = dr.querySelector('.dr-b'), changed = () => { renderFilters(); renderHeader(); drawAll(); };
  [['global', L('allTabs')], ['tab', tpl(L('thisTab'), {tab: t.label})]].forEach(([scope, title]) => {
    const list = adv.filter(f => f.scope === scope); if (!list.length) return;
    body.appendChild(el('div', 'dr-sec', esc(title)));
    list.forEach(f => {
      const sec = el('div', 'dr-f'), head = el('div', 'dr-l', `<span>${esc(f.control === 'toggle' ? '' : f.label)}</span>`);
      if (f.control !== 'toggle') { const c = el('button'); c.textContent = L('clear'); c.onclick = () => { S.f[f.field] = undefined; refresh(); }; head.appendChild(c); sec.appendChild(head); }
      sec.appendChild(CONTROLS[f.control](f, changed));
      body.appendChild(sec);
    });
  });
  dr.querySelector('.dr-x').onclick = closeDrawer;
  dr.querySelector('[data-a=done]').onclick = closeDrawer;
  dr.querySelector('[data-a=clear]').onclick = () => { adv.forEach(f => S.f[f.field] = undefined); S.adhoc[S.tab] = {}; refresh(); };
  document.body.append(scrim, dr);
}
addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
const filterDefaults = () => Object.fromEntries([...(D.filters || []), ...D.tabs.flatMap(t => t.filters || [])].filter(f => f.default !== undefined).map(f => [f.field, f.default]));
function resetAll() {
  S.time = {days: TIME?.default ?? TIME?.presets?.[0]?.days ?? 30}; S.compare = TIME?.compare !== 'off'; S.f = filterDefaults(); S.adhoc[S.tab] = {};
  for (const k in MS) delete MS[k];
  renderTab();
}
const curTab = () => D.tabs.find(t => t.id === S.tab) || D.tabs[0];
function filtersFor(t) {
  return [...(D.filters || []).map(f => ({...f, scope: 'global'})), ...(t.filters || []).map(f => ({...f, scope: 'tab'}))].map(f => {
    const def = FIELDS[f.field];
    return {...f, def, label: f.label || def.label, control: DashboardValidator.controlFor(def, f, def.options.length), placement: f.placement || 'advanced'};
  });
}

/* ---------- modules ---------- */
function splitInfo(m) {
  if (!m.segments?.length) return null;
  const base = m.type === 'donut' || (m.type === 'bar' && (m.layout === 'ranked' || m.layout === 'diverging')) ? m.groupBy
    : m.type === 'area' || (m.type === 'bar' && m.layout === 'stacked-100') ? m.stackBy : m.type === 'scatter' ? m.color : null;
  const opts = (base ? [base] : [null]).concat(m.segments.filter(s => s !== base));
  return {opts, def: m.split !== undefined ? m.split : base ?? null};
}
function mount(m, parent) {
  if (m.type === 'stack') { const st = el('div', 'stack'); st.style.gridColumn = `span ${m.span || 12}`; parent.appendChild(st); m.modules.forEach(c => mount(c, st)); return; }
  const si = splitInfo(m);
  MS[m.id] = MS[m.id] || {measure: m.measures?.[0] || m.measure, sortBy: m.sort?.by, sortDir: m.sort?.dir, split: si ? si.def : null};
  let body, card = null;
  if (m.type === 'kpi') body = el('div', 'kpis');
  else {
    card = el('article', 'card', `<header class="card-h"><div><div class="card-t"></div><div class="card-d"></div></div><div class="ctl"></div></header><div class="body${m.type === 'table' ? ' bleed' : ''}"></div>`);
    body = card.querySelector('.body');
  }
  const node = card || body; if (parent.classList.contains('grid')) node.style.gridColumn = `span ${m.span || 12}`;
  parent.appendChild(node);
  const mt = {m, el: body, card, si};
  MOUNTS.push(mt); controls(mt);
}
function controls(mt) {
  const {m, card, si} = mt; if (!card) return;
  const ms = MS[m.id], ctl = card.querySelector('.ctl'); ctl.innerHTML = '';
  if (si) {
    const w = el('label', 'split', `<span>${esc(L('splitBy'))}</span><div class="sel"><select>${si.opts.map((o, i) => `<option value="${i}"${o === ms.split ? ' selected' : ''}>${esc(o ? fLabel(o) : L('none'))}</option>`).join('')}</select></div>`);
    w.querySelector('select').onchange = e => { ms.split = si.opts[+e.target.value]; draw(mt); };
    ctl.appendChild(w);
  }
  if (m.measures?.length > 1 && m.type !== 'kpi') ctl.appendChild(segmented(m.measures.map(x => [x, mLabel(x)]), ms.measure, v => { ms.measure = v; controls(mt); draw(mt); }));
}
function draw(mt) {
  const {m, el: body, card} = mt, ctx = ctxBase(), ms = MS[m.id];
  ctx.measure = mLabel(ms.measure);
  const splitField = ms.split || (mt.si ? null : [].concat(m.groupBy ?? [])[0]);
  ctx.split = splitField ? String(fLabel(splitField)).toLowerCase() : '';
  tip.hide(); body.innerHTML = '';
  body.style.height = AUTO.has(m.type) || (m.type === 'bar' && AUTO_BARS.has(m.layout)) ? '' : (m.height || HEIGHTS[m.type] || 300) + 'px';
  const header = () => { if (!card) return; card.querySelector('.card-t').textContent = tpl(m.title, ctx); card.querySelector('.card-d').textContent = tpl(m.description, ctx); };
  try {
    const p = RENDER[m.type](body, m, ms, ctx); header();
    if (p?.catch) p.catch(err => { body.innerHTML = `<div class="err">${esc(err.message)}</div>`; });
  } catch (err) { console.error(err); header(); body.innerHTML = `<div class="err">${esc(m.id)}: ${esc(err.message)}</div>`; }
}
function drawAll() { MOUNTS.forEach(mt => { try { draw(mt); } catch (err) { console.error(err); } }); }
function renderTab() {
  closeDrawer();
  MOUNTS = []; const g = $('grid'); g.innerHTML = '';
  AF = filtersFor(curTab());
  renderHeader(); renderFilters();
  curTab().modules.forEach(m => mount(m, g));
  drawAll(); scrollTo(0, 0);
}

/* ---------- load + validate ---------- */
function showErrors(errs, src) {
  const n = errs.length;
  document.title = 'Dashboard configuration error';
  document.body.innerHTML = `<div class="inv"><div class="inv-c"><div class="inv-t">This dashboard can’t be shown</div><div class="inv-s">${n} problem${n > 1 ? 's' : ''} in <code>${esc(src)}</code>. Nothing is rendered until the file is valid. Fix the items below, or run <code>node validate.js ${esc(src)}</code> to check.</div><ol>${errs.slice(0, 60).map(e => `<li><code>${esc(e.path)}</code><span>${esc(e.message)}</span></li>`).join('')}</ol>${n > 60 ? `<div class="inv-s">…and ${n - 60} more.</div>` : ''}</div></div>`;
}
async function load() {
  const inline = document.getElementById('dashboard-data');
  if (inline) return {json: JSON.parse(inline.textContent), src: 'inline dashboard-data'};
  const url = new URLSearchParams(location.search).get('data') || 'dashboard.json';
  const r = await fetch(url); if (!r.ok) throw new Error(`Could not load ${url} (${r.status})`);
  return {json: JSON.parse(await r.text()), src: url, base: url};
}
async function loadSchema(json, base) {
  const inline = document.getElementById('dashboard-schema');
  if (inline) return JSON.parse(inline.textContent);
  try { const u = new URL(json.$schema || 'dashboard.schema.json', new URL(base || 'dashboard.json', location.href)); const r = await fetch(u); return r.ok ? r.json() : null; } catch { return null; }
}
(async () => {
  let src = 'dashboard.json';
  try {
    const got = await load(); src = got.src;
    const schema = await loadSchema(got.json, got.base);
    if (!window.DashboardValidator) throw new Error('validate.js did not load; it must sit next to Dashboard.html');
    const errs = DashboardValidator.validateDashboard(got.json, schema);
    if (errs.length) return showErrors(errs, src);
    D = got.json;
  } catch (err) { return showErrors([{path: '$', message: err.message}], src); }
  makeFormats(); prep();
  S = {tab: location.hash.slice(1), time: {days: TIME?.default ?? TIME?.presets?.[0]?.days ?? 30}, compare: TIME?.compare !== 'off', f: filterDefaults(), adhoc: {}};
  renderShell(); renderTab();
  addEventListener('hashchange', () => { S.tab = location.hash.slice(1); renderTab(); });
  let lastW = $('grid').clientWidth, timer;
  new ResizeObserver(() => { const w = $('grid').clientWidth; if (w === lastW) return; lastW = w; clearTimeout(timer); timer = setTimeout(drawAll, 140); }).observe($('grid'));
})();
</script>
